<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica de Tecnología del Diseño</title><style>
:root{--bg:#fff;--fg:#1c2330;--mut:#5b6678;--acc:#1F3A5F;--amb:#E8A33D;--line:#d6dbe4;--ok:#e6f4ea;--okfg:#1b6b34;--card:#f6f8fb}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--fg:#e8ecf3;--mut:#9aa6ba;--acc:#8db4ee;--amb:#E8A33D;--line:#2b3547;--ok:#173324;--okfg:#7fd89b;--card:#1b2230}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.35rem;margin:0 0 4px;color:var(--acc)}h2{font-size:1.15rem;border-bottom:2px solid var(--amb);padding-bottom:4px;margin:26px 0 6px;color:var(--acc)}
.sub0{color:var(--mut);margin:0 0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
label{display:block;font-weight:600;margin:8px 0 4px}
input[type=text],input[type=date],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:110px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin:8px 8px 0 0}
button.sec2{background:transparent;color:var(--acc);border:1px solid var(--acc)}
@media (prefers-color-scheme:dark){button{color:#10151d}}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:600;margin:14px 0 4px}
.note{color:var(--mut);margin:2px 0 10px}
.q{margin:14px 0;page-break-inside:avoid}.stem{margin:0 0 4px}.sub{margin-left:18px}
ol.opts{list-style:none;margin:0;padding:0 0 0 14px}ol.opts li{padding:3px 6px;border-radius:6px}.l{font-weight:700;display:inline-block;width:22px}
li.ok{background:var(--ok);color:var(--okfg)}.tick{margin-left:4px}
.part{margin:8px 0 2px 10px}.crit{margin:0 0 8px 24px;color:var(--mut);font-size:.92rem;border-left:3px solid var(--amb);padding-left:8px}
table.tb{border-collapse:collapse;margin:8px 0;font-size:.92rem;width:100%}table.tb th,table.tb td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}table.tb th{background:var(--card)}
.keyline{background:var(--ok);color:var(--okfg);padding:8px 10px;border-radius:8px;font-weight:600;margin:10px 0}
table.list{border-collapse:collapse;width:100%;font-size:.9rem}table.list th,table.list td{border:1px solid var(--line);padding:5px 7px;text-align:left}
.warn{color:var(--mut);font-size:.9rem}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.wrap{padding:0}h1,h2{color:#000}li.ok{background:none;color:#000}.panel{border:0;padding:0}}
</style></head><body><div class="wrap">
<h1>Práctica de Tecnología del Diseño · 2do BGU</h1>
<p class="sub0">Tercer parcial. Cada día que ingreses te saldrán preguntas nuevas. Hazla a mano en tu cuaderno o carpeta.</p>
<div class="panel noprint">
<label for="nm">Tu nombre y apellido</label>
<input type="text" id="nm" autocomplete="off" placeholder="Ej.: Camila Aspiazu">
<button id="go">Generar mi práctica</button>
<p class="warn">Usa siempre tu nombre escrito igual. El mismo día, con el mismo nombre, te saldrá la misma práctica aunque recargues la página.</p>
</div>
<div id="out"></div>
<div class="noprint" id="acts" style="display:none"><button onclick="window.print()">Imprimir o guardar en PDF</button></div>
</div><script>const MCQ=[{"id": "e1", "t": "E", "s": "Un quiosco de autoservicio de una biblioteca debe diseñarse para que la mayoría de los usuarios pueda alcanzar y usar cómodamente la pantalla táctil. ¿Qué percentil de datos antropométricos se debe usar?", "o": ["Percentil 99", "Percentil 95", "Percentil 50", "Percentil 5"], "f": true}, {"id": "e2", "t": "E", "s": "Se debe determinar el ancho mínimo de los asientos de un cine público para garantizar la comodidad de la mayoría de los usuarios. ¿Qué dato antropométrico es el más apropiado?", "o": ["Percentil 5", "Percentil 50", "Percentil 95", "Rango entre el percentil 5 y el 95"], "f": true}, {"id": "e3", "t": "E", "s": "¿Cuál de los siguientes ejemplos ilustra mejor el uso de datos antropométricos dinámicos en el diseño de productos?", "o": ["Medir el ancho de los hombros para diseñar una chaqueta", "Medir el tamaño de la cabeza para diseñar un casco", "Medir la circunferencia de la muñeca para diseñar la correa de un reloj", "Medir la fuerza de agarre de una persona al girar la manija de una puerta"], "f": false}, {"id": "e4", "t": "E", "s": "¿Qué término se refiere al espacio físico necesario entre dos objetos para permitir un movimiento seguro y cómodo?", "o": ["Alcance", "Holgura", "Ajustabilidad", "Rangos de percentiles"], "f": false}, {"id": "e5", "t": "E", "s": "¿Cuál de los siguientes NO se considera un factor psicológico en el diseño?", "o": ["Olfato", "Sonido", "Gusto", "Fuerza"], "f": false}, {"id": "e6", "t": "E", "s": "¿Cuáles de los siguientes factores influyen en los datos antropométricos usados en el diseño?\n   I. Edad\n   II. Género\n   III. Etnia\n   IV. Preferencias personales", "o": ["Solo I y II", "I, II y III", "Solo II y IV", "I, II, III y IV"], "f": true}, {"id": "e7", "t": "E", "s": "Un diseñador crea un panel de control para un espacio público. Para que los usuarios lleguen a todos los botones aunque se estiren o se inclinen hacia adelante, debe considerar la distancia máxima que una persona puede alcanzar más allá de su postura normal de pie. ¿Qué tipo de alcance se está considerando?", "o": ["Alcance cómodo", "Alcance extendido", "Alcance estático", "Alcance funcional"], "f": false}, {"id": "e8", "t": "E", "s": "¿Cuál de los siguientes NO se considera normalmente un factor fisiológico en el diseño?", "o": ["Control muscular", "Respuesta emocional", "Fuerza", "Agudeza visual"], "f": false}, {"id": "e9", "t": "E", "s": "Una aplicación móvil usa un ícono de papelera para representar la función «Eliminar». Los usuarios entienden su función de inmediato, aunque en lo digital no se usan papeleras físicas. ¿Cómo se describe mejor esta decisión de diseño?", "o": ["Escenarios", "Estereotipo poblacional", "Demografía", "Persona"], "f": false}, {"id": "e10", "t": "E", "s": "En la interfaz de un equipo hospitalario, un botón rojo indica «Parada de emergencia». El personal médico reconoce su función al instante, aunque el color y la forma del botón no se explican en la documentación. ¿Cómo se describe mejor esta decisión de diseño?", "o": ["Estereotipo poblacional", "Escenarios", "Demografía", "Persona"], "f": false}, {"id": "u1", "t": "U", "s": "¿Qué enunciado describe mejor un proceso de diseño iterativo?", "o": ["Lineal y fijo", "Terminado después de un solo prototipo", "Cíclico, con pruebas repetidas", "Aleatorio y sin estructura"], "f": false}, {"id": "u2", "t": "U", "s": "¿Para qué se usa principalmente el pensamiento convergente?", "o": ["Refinar y seleccionar el mejor concepto", "Ampliar las posibilidades", "Generar ideas rápidamente", "Evitar la evaluación"], "f": false}, {"id": "u3", "t": "U", "s": "Un equipo diseña una pulsera de actividad física. Para ello crea el perfil de una persona que rechaza la tecnología vestible y prefiere las soluciones analógicas. ¿Qué tipo de persona describe mejor este perfil?", "o": ["Persona terciaria", "Persona secundaria", "Persona primaria", "Anti-persona"], "f": false}, {"id": "u4", "t": "U", "s": "Durante la investigación de una aplicación de banca móvil, un equipo crea una herramienta visual que muestra (i) los pasos que sigue el usuario para completar una transacción, (ii) sus pensamientos, emociones y puntos de dolor en cada etapa y (iii) oportunidades de mejora, como reducir pasos o aclarar instrucciones. ¿Qué herramienta visual es la más adecuada?", "o": ["Mapa del recorrido del usuario (journey map)", "Guion gráfico (storyboard)", "Persona", "Análisis de tareas"], "f": false}, {"id": "u5", "t": "U", "s": "Un equipo que desarrolla un electrodoméstico inteligente visita varios hogares y observa a las personas preparar comidas en su propia cocina, sin intervenir. Registran comportamientos, problemas y factores del entorno. ¿Qué método de investigación centrado en el usuario representa mejor este escenario?", "o": ["Pruebas de usabilidad en un laboratorio", "Encuestas", "Entrevistas", "Investigación de campo"], "f": false}, {"id": "u6", "t": "U", "s": "Un mapa de empatía es una herramienta del diseño centrado en el usuario. Incluye lo que el usuario dice, piensa y hace. ¿Cuál de los siguientes elementos completa el mapa de empatía?", "o": ["Oye", "Quiere", "Siente", "Ve"], "f": false}, {"id": "u7", "t": "U", "s": "Un equipo evalúa cómo interactúan los usuarios con una nueva aplicación móvil. En lugar de observarlos en tiempo real, recopila datos revisando grabaciones de pantalla y videos de los usuarios navegando la aplicación en su propio entorno. ¿Qué método de investigación con usuarios se está usando?", "o": ["Pruebas de usabilidad", "Entrevistas a usuarios", "Observación indirecta", "Observación directa"], "f": false}, {"id": "u8", "t": "U", "s": "Un equipo desarrolla una pantalla táctil para equipos de monitoreo hospitalario. Crea el perfil de un administrador del hospital que usa el equipo solo de forma ocasional para revisar datos de pacientes, sin participar en la atención directa ni en el manejo frecuente del dispositivo. ¿Qué tipo de persona describe mejor a este usuario?", "o": ["Persona terciaria", "Anti-persona", "Persona secundaria", "Persona primaria"], "f": false}, {"id": "u9", "t": "U", "s": "Un equipo que desarrolla un nuevo quiosco de venta de boletos de transporte público visita varias estaciones de tren y observa a los usuarios en situaciones reales, sin interferir. Toma notas sobre su comportamiento, dificultades y factores del entorno. ¿Qué método de investigación se está usando?", "o": ["Observación del usuario en un entorno controlado", "Grupo focal", "Experimento", "Investigación de campo"], "f": false}, {"id": "u10", "t": "U", "s": "Agregar marcas táctiles en la perilla de una lavadora para usuarios con discapacidad visual es un ejemplo de:", "o": ["Marca (branding)", "Diseño inclusivo", "Diseño ergonómico", "Tecnología inteligente"], "f": false}, {"id": "m1", "t": "M", "s": "El equipo de diseño de Smart Plant Ivy construye un modelo a pequeña escala, con materiales simples y sin funciones, para comprobar las proporciones antes del prototipo final. ¿Cómo se describe mejor este modelo?", "o": ["Baja fidelidad", "Prototipo virtual", "Prototipo funcional", "Alta fidelidad"], "f": false}, {"id": "m2", "t": "M", "s": "Un equipo diseña un simulador de vuelo para entrenar pilotos. Quiere que la simulación replique lo más fielmente posible la experiencia de volar un avión real, incluida la respuesta de los controles, el entorno visual y la retroalimentación física. ¿Qué término describe mejor hasta qué punto el simulador imita las condiciones reales?", "o": ["Análisis por elementos finitos", "Tecnología háptica", "Instrumentado", "Rango de fidelidad"], "f": false}, {"id": "m4", "t": "M", "s": "Un diseñador de Skoda esculpe un modelo de arcilla a tamaño real de un auto nuevo. El modelo se usa para evaluar la forma del vehículo, la calidad de sus superficies y su atractivo visual antes de la producción. ¿Qué tipo de modelo se está creando?", "o": ["Modelo instrumentado", "Maqueta (mock-up)", "Modelo a escala", "Modelo estético"], "f": false}, {"id": "m5", "t": "M", "s": "Una empresa de calzado deportivo prueba la ergonomía de unos zapatos con un modelo generado por computadora, basado en datos humanos reales, que simula el movimiento y la interacción física con el producto y permite analizar postura, marcha y puntos de presión. ¿Qué tecnología se está usando?", "o": ["Captura de movimiento", "Tecnología háptica", "Humanos digitales", "Realidad virtual"], "f": false}, {"id": "m6", "t": "M", "s": "Un diseñador necesita un prototipo con detalles muy finos y superficies lisas para el concepto de un nuevo dispositivo médico. ¿Qué método de prototipado rápido es el más adecuado?", "o": ["Modelado por deposición fundida (FDM)", "Fabricación de objetos laminados (LOM)", "Sinterizado selectivo por láser (SLS)", "Estereolitografía (SLA)"], "f": false}, {"id": "m7", "t": "M", "s": "¿Cuál de los siguientes es un ejemplo de modelo de alta fidelidad usado en el diseño de productos?", "o": ["Modelo de cartón de una aspiradora de mano para probar el agarre y el alcance", "Maqueta de espuma del control remoto de un televisor para evaluar el tamaño y la posición de los botones", "Maqueta de arcilla del mango de un cepillo de dientes para probar la forma ergonómica", "Prototipo totalmente funcional de una lámpara de escritorio con electrónica y materiales realistas"], "f": false}, {"id": "m8", "t": "M", "s": "¿Qué tipo de dibujo muestra cómo encajan e interactúan las diferentes partes de un producto?", "o": ["Dibujos anotados", "Dibujos de ensamblaje", "Dibujos de detalle", "Dibujos de piezas"], "f": false}, {"id": "m9", "t": "M", "s": "Un reloj inteligente usa retroalimentación háptica para avisar al usuario que recibió un mensaje. ¿Con qué sentido humano se relaciona más esta interacción?", "o": ["Vista", "Olfato", "Oído", "Tacto"], "f": false}, {"id": "m10", "t": "M", "s": "Una empresa se prepara para fabricar un tensiómetro (monitor de presión arterial). ¿Qué tipo de dibujo es el más apropiado para comunicar las dimensiones exactas, las tolerancias y los detalles de los componentes a los equipos de ingeniería y producción?", "o": ["Proyección ortogonal", "Boceto a mano alzada", "Dibujo isométrico ensamblado", "Dibujo en explosión"], "f": false}, {"id": "m11", "t": "M", "s": "¿Cuáles de las siguientes características describen mejor un prototipo de alta fidelidad?\n   I. Se parece mucho al producto final\n   II. Incluye funcionalidad interactiva\n   III. Es útil para las pruebas finales de usabilidad", "o": ["Solo I y II", "Solo I y III", "Solo II y III", "I, II y III"], "f": true}, {"id": "m12", "t": "M", "s": "Una empresa de videojuegos deportivos registra los movimientos de atletas con marcadores reflectantes y varias cámaras para crear animaciones digitales precisas. ¿Qué tecnología se está usando?", "o": ["Realidad virtual", "Tecnología háptica", "Captura de movimiento", "Humanos digitales"], "f": false}, {"id": "s1", "t": "S", "s": "Una marca popular de teléfonos lanza un modelo con hardware avanzado que admite funciones que los modelos anteriores no pueden ejecutar, aunque estos todavía funcionan. ¿Qué tipo de obsolescencia representa este caso?", "o": ["Obsolescencia tecnológica", "Obsolescencia programada", "Obsolescencia social", "Obsolescencia de estilo"], "f": false}, {"id": "s2", "t": "S", "s": "El triple bottom line mide la sostenibilidad en términos de:", "o": ["Ganancias y medio ambiente", "Personas, planeta y ganancias", "Lo social y lo ambiental", "Tiempo, costo y calidad"], "f": false}, {"id": "s3", "t": "S", "s": "Un fabricante de teléfonos presenta un modelo cuya batería y pantalla se pueden quitar con herramientas simples para reemplazar o reciclar cada pieza al final de su vida útil. ¿Qué estrategia de diseño se ha aplicado?", "o": ["Diseño para el ensamblaje", "Diseño para el desmontaje", "Diseño para el mantenimiento", "Diseño para la fabricación"], "f": false}, {"id": "s4", "t": "S", "s": "El programa Worn Wear de Patagonia da un descuento a los clientes que devuelven ropa usada, la cual se tritura y se vuelve a hilar para producir tela nueva. ¿Qué etapa de la economía circular representa mejor este proceso?", "o": ["Reutilización", "Remanufactura", "Reparación", "Reciclaje"], "f": false}, {"id": "s5", "t": "S", "s": "Las cadenas globales de comida rápida generan millones de toneladas de residuos plásticos al año. Una empresa introduce un sistema de empaques con envases de bagazo (fibra de caña de azúcar). Los clientes devuelven los envases usados al local, donde se compostan y se reemplazan por otros nuevos, lo que reduce los residuos y el consumo de recursos. ¿Qué enfoque de diseño se está aplicando?", "o": ["Proceso de diseño lineal", "Diseño para la ergonomía", "Diseño para el desmontaje", "Proceso de economía circular"], "f": false}, {"id": "s6", "t": "S", "s": "Una fábrica opera con energía solar y eólica instalada en el mismo sitio, como la Gigafactory de Tesla en Nevada. ¿Cuál es el desafío más probable de depender de energía renovable variable para la producción?", "o": ["La energía renovable siempre cuesta más que los combustibles fósiles", "La energía solar y eólica no puede combinarse con baterías de almacenamiento", "Las fluctuaciones en la producción solar y eólica pueden interrumpir procesos de manufactura continuos", "Los sistemas renovables aumentan las emisiones de gases de efecto invernadero durante su operación"], "f": false}, {"id": "s7", "t": "S", "s": "El programa Worn Wear de Patagonia repara chaquetas usadas y las revende a menor costo, lo que alarga la vida del producto y reduce la necesidad de materiales nuevos. ¿Cuál de los principios de diseño sostenible de Datschefski demuestra con más fuerza?", "o": ["Seguro", "Solar", "Cíclico", "Social"], "f": false}, {"id": "s8", "t": "S", "s": "Un proveedor de helados obtiene muchos de sus ingredientes, como cacao, azúcar y vainilla, de proveedores con certificación Fairtrade. Esto garantiza a los agricultores precios mínimos estables, primas de desarrollo comunitario y mejores condiciones de trabajo. ¿Qué aspecto del triple bottom line se está priorizando?", "o": ["Personas", "Planeta", "Ganancias", "Productividad"], "f": false}, {"id": "s9", "t": "S", "s": "Una marca de calzado deportivo lanza una nueva versión de su zapatilla estrella con colores actualizados y un logotipo rediseñado. El modelo anterior aún funciona bien, pero pierde popularidad rápidamente porque ya no va con las tendencias de la moda. ¿Qué tipo de obsolescencia representa este caso?", "o": ["Obsolescencia tecnológica", "Obsolescencia programada", "Obsolescencia social", "Obsolescencia de estilo"], "f": false}, {"id": "s10", "t": "S", "s": "Un fabricante de muebles comienza a usar madera con certificación FSC en toda su gama de productos. ¿Qué consideración ética está priorizando la empresa?", "o": ["Reducir el riesgo de acusaciones de lavado verde (greenwashing)", "Mejorar la eficiencia del procesamiento de la madera", "Cumplir los requisitos arancelarios del comercio internacional", "Garantizar un abastecimiento responsable y rastreable"], "f": false}];
const OPEN=[{"id": "o1", "t": "U", "title": "Audífono para adultos mayores con artritis", "s": ["Los audífonos son dispositivos esenciales para las personas con pérdida auditiva, en particular los adultos mayores que también pueden tener artritis y menor control motor fino. Los diseñadores deben considerar la ergonomía, la usabilidad y la comodidad al desarrollar estos productos. La tabla muestra un extracto de las especificaciones de función del producto del proyecto de diseño de un estudiante para un audífono amigable con la artritis."], "tb": [["Función del producto", "Esencial", "Deseable"], ["1.1", "Debe ser fácil de colocar y retirar para usuarios con destreza reducida", ""], ["1.2", "Debe incluir: compartimento de batería accesible; control de volumen ampliado; superficie de tacto suave para el agarre", "Base de carga magnética para reducir los movimientos finos de los dedos"], ["1.3", "Proporcionar una amplificación de audio clara en entornos cotidianos", "Aplicación integrada para el teléfono que permita ajustar el volumen y el modo a distancia"]], "p": [{"l": "a", "q": "Indique un método de investigación centrado en el usuario que el estudiante pudo haber usado para comprender a la persona objetivo de este audífono.", "m": 1}, {"l": "b", "q": "Explique por qué una persona secundaria, como una enfermera que trabaja en un hogar de cuidado residencial, puede ser útil al diseñar este audífono.", "m": 2}, {"l": "c", "q": "Explique cómo un equipo de diseño multidisciplinario pudo contribuir a mejorar el diseño del audífono.", "m": 3}, {"l": "d", "q": "Describa una mejora que el estudiante podría hacer a su diseño a partir de las pruebas y el refinamiento del audífono.", "m": 2}]}, {"id": "o2", "t": "S", "title": "Empaque de micelio (IKEA)", "s": ["IKEA ha comenzado a introducir empaques a base de micelio como reemplazo de las espumas derivadas del petróleo. El empaque se cultiva a partir de estructuras de raíces de hongos y residuos agrícolas, lo que lo hace totalmente compostable y adecuado para proteger los productos durante el transporte."], "tb": null, "p": [{"l": "a", "q": "Indique una propiedad física del micelio que lo hace adecuado para un empaque protector.", "m": 1}, {"l": "b", "q": "Describa una forma en que el empaque de micelio apoya una economía circular.", "m": 2}, {"l": "c", "q": "Explique un desafío práctico o de sistema asociado al uso de materiales biodegradables como el micelio en empaques (excluyendo problemas de rendimiento).", "m": 2}, {"l": "d", "q": "Explique una limitación de rendimiento que los diseñadores deben considerar al reemplazar las espumas tradicionales por micelio.", "m": 2}]}, {"id": "o3", "t": "I", "title": "Jeans adaptados para prótesis y silla de ruedas", "s": ["Las personas con prótesis de miembro inferior y los usuarios de silla de ruedas suelen sentir incomodidad y dificultad al usar jeans comunes. El denim tradicional puede restringir el movimiento, crear puntos de presión alrededor del encaje de la prótesis y dificultar el vestirse a quienes tienen poca flexibilidad o destreza manual reducida. No Limbits, una empresa de ropa adaptada fundada por personas amputadas, desarrolló jeans diseñados para quienes usan prótesis, con aberturas laterales con cierre extendidas e insertos de paneles flexibles.", "En las primeras etapas del diseño de ropa inclusiva, los diseñadores exploran distintos sistemas de cierre, formas de paneles y puntos de acceso mediante bocetos y prototipos rápidos. Estos bocetos ayudan a identificar desafíos ergonómicos, como vestirse y desvestirse estando sentado o dejar suficiente espacio alrededor del encaje de la prótesis."], "tb": null, "p": [{"l": "a", "q": "Resuma por qué se usarían bocetos en el desarrollo temprano de jeans adaptados para usuarios de silla de ruedas o de prótesis.", "m": 2}, {"l": "b", "q": "Explique un factor ergonómico que se debe considerar al diseñar jeans adaptados para usuarios con una prótesis de pierna.", "m": 3}, {"l": "c", "q": rar la comodidad y la usabilidad del medidor para trabajadores al aire libre.", "m": 3}]}, {"id": "o11", "t": "M", "title": "Casco de realidad virtual Meta Quest", "s": ["El casco de realidad virtual Meta Quest exige pruebas extensas durante su desarrollo, entre ellas el ajuste de la correa de cabeza, la comodidad de la interfaz facial, la ergonomía de los controles y el diseño de la interacción. Los diseñadores usan modelos CAD de alta fidelidad, simulaciones virtuales, realidad aumentada, dispositivos hápticos y tecnologías de prototipado rápido para evaluar el producto antes de fabricarlo."], "tb": null, "p": [{"l": "a", "q": "Explique una razón por la que se usaría el modelado de alta fidelidad durante el desarrollo del casco Meta Quest.", "m": 2}, {"l": "b", "q": "Explique la diferencia entre el modelado por deposición fundida (FDM) y el sinterizado selectivo por láser (SLS) al producir piezas prototipo para el Meta Quest.", "m": 3}]}, {"id": "o12", "t": "I", "title": "Hippo Water Roller", "s": ["En muchas aldeas de África subsahariana, las mujeres y los niños caminan varios kilómetros cargando recipientes de 20 a 25 kg sobre la cabeza, lo que causa lesiones de columna, fatiga y menor asistencia escolar. El Hippo Water Roller es un dispositivo que permite rodar por el suelo 90 L de agua en lugar de cargarla. El tambor es de un compuesto de polietileno estabilizado contra los rayos UV y resistente a impactos, con un mango de acero o polímero reforzado. Su diseño busca permitir que niños, adultos mayores y personas con poca fuerza en la parte superior del cuerpo transporten agua de forma segura. El fabricante promueve además prácticas de economía circular, como reparar y reprocesar el tambor de polietileno al final de su vida útil."], "tb": null, "p": [{"l": "a", "q": "Explique una forma en que el Hippo Water Roller demuestra diseño inclusivo.", "m": 2}, {"l": "b", "q": "Tomando el Hippo Water Roller como referencia, analice cómo el producto apoya los principios function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function norm(n){return n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function buildExam(name,dateStr){
  const r=mulberry32(xmur3(norm(name)+'|'+dateStr)());
  const counts={E:2,U:2,M:3,S:3};
  let pick=[];
  for(const t of Object.keys(counts)){pick=pick.concat(shuffle(MCQ.filter(q=>q.t===t),r).slice(0,counts[t]));}
  pick=shuffle(pick,r);
  const mcq=pick.map(q=>{const perm=q.f?[0,1,2,3]:shuffle([0,1,2,3],r);return {q,perm};});
  const marks=o=>o.p.reduce((s,p)=>s+p.m,0);
  let open=null;
  for(let k=0;k<400;k++){
    const topics=shuffle(['U','S','I','M','E'],r).slice(0,3);
    const items=topics.map(t=>{const pool=OPEN.filter(o=>o.t===t);return pool[Math.floor(r()*pool.length)];});
    const tot=items.reduce((s,o)=>s+marks(o),0);
    open=items; if(tot>=15&&tot<=19)break;
  }
  return {mcq,open,openMarks:open.reduce((s,o)=>s+marks(o),0)};
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function para(s){return s.split('\n').map((l,i)=>i?'<div class="sub">'+esc(l)+'</div>':esc(l)).join('');}
const L='ABCD';
function renderExam(ex,teacher){
  let h='<section class="sec"><h2>Sección A</h2><p class="note">Responde a mano en tu cuaderno o carpeta: escribe el número de la pregunta y la letra de la respuesta correcta. [1 punto cada una]</p>';
  ex.mcq.forEach((m,i)=>{
    h+='<div class="q"><p class="stem"><b>'+(i+1)+'.</b> '+para(m.q.s)+'</p><ol class="opts">';
    m.perm.forEach((pi,j)=>{
      const ok=teacher&&ANS[m.q.id]===pi;
      h+='<li class="'+(ok?'ok':'')+'"><span class="l">'+L[j]+'.</span> '+esc(m.q.o[pi])+(ok?' <b class="tick">✔</b>':'')+'</li>';
    });
    h+='</ol></div>';
  });
  h+='</section><section class="sec"><h2>Sección B</h2><p class="note">Responde por escrito, de forma organizada, en tu cuaderno o carpeta. Los puntos de cada parte van entre corchetes. [Total: '+ex.openMarks+' puntos]</p>';
  ex.open.forEach((o,i)=>{
    const n=ex.mcq.length+i+1; // numeración continua
    h+='<div class="q"><p class="stem"><b>'+(i+1)+'. '+esc(o.title)+'</b></p>';
    o.s.forEach(p=>{h+='<p>'+esc(p)+'</p>';});
    if(o.tb){h+='<table class="tb">'+o.tb.map((r,ri)=>'<tr>'+r.map(c=>(ri?'<td>':'<th>')+esc(c)+(ri?'</td>':'</th>')).join('')+'</tr>').join('')+'</table>';}
    o.p.forEach((p,pi)=>{
      h+='<p class="part">('+String.fromCharCode(97+pi)+') '+esc(p.q)+' <b>['+p.m+']</b></p>';
      if(teacher){h+='<p class="crit"><b>Criterio:</b> '+esc(CRIT[o.id][pi])+'</p>';}
    });
    h+='</div>';
  });
  h+='</section>';
  return h;
}
function keyLine(ex){return ex.mcq.map((m,i)=>(i+1)+'-'+L[m.perm.indexOf(ANS[m.q.id])]).join('  ');}
function fmtDate(d){const [y,m,dd]=d.split('-');return dd+'/'+m+'/'+y;}


document.getElementById('go').onclick=function(){
  const name=document.getElementById('nm').value.trim();
  if(!name){alert('Escribe tu nombre.');return;}
  const d=today(), ex=buildExam(name,d);
  document.getElementById('out').innerHTML='<div class="meta"><span>Estudiante: '+esc(name)+'</span><span>Fecha: '+fmtDate(d)+'</span><span>Tiempo sugerido: 45 min</span></div>'+renderExam(ex,false);
  document.getElementById('acts').style.display='block';
  window.scrollTo({top:document.getElementById('out').offsetTop-10,behavior:'smooth'});
};
document.getElementById('nm').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
</script></body></html>
